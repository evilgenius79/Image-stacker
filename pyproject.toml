[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrostack"
version = "0.1.0"
description = "AI-enhanced astronomy image stacker (local)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "astropy>=5.3",
    "photutils>=1.10",
    "astroalign>=2.5",
    "Pillow>=10.0",
    "tifffile>=2023.7",
    "rawpy>=0.19",
    "tqdm>=4.66",
    "torch>=2.1",
    "torchvision>=0.16",
    "spandrel>=0.3.4",
    "click>=8.1",
    "gradio>=4.0",
]

[project.scripts]
astrostack = "astrostack.cli:main"
astrostack-ui = "astrostack.webui:main"

[tool.setuptools.packages.find]
include = ["astrostack*"]
